<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EBL — Spin &amp; Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== EBL brand tokens ===== */
:root{
  --ink:#080808; --ink-2:#0d0d0e;
  --gold:#B08D57; --gold-2:#CBA876;
  --maroon:#6E1B26; --maroon-2:#8a2531;
  --sand:#EBDFCC; --sand-2:#F2E9DC;
  --seg-a:#191c22; --seg-b:#2a2f39;
  --ring:#EBDFCC;
}
*{box-sizing:border-box}
html,body{margin:0}
.ebl-raffle{
  background:radial-gradient(120% 90% at 20% 0%, #14100e 0%, var(--ink) 55%);
  color:var(--sand-2);
  font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(18px,4vw,56px);
  padding-bottom:calc(clamp(18px,4vw,56px) + env(safe-area-inset-bottom));
}
.ebl-raffle .wrap{
  width:100%; max-width:1120px;
  display:grid; grid-template-columns:1.05fr 1fr; gap:clamp(24px,5vw,72px);
  align-items:center;
}

/* ===== Wheel ===== */
.ebl-raffle .stage{position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:1/1;}
.ebl-raffle .pointer{
  position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  z-index:5; width:0; height:0;
  border-left:18px solid transparent; border-right:18px solid transparent;
  border-top:28px solid var(--sand);
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));
}
.ebl-raffle .pointer::after{
  content:""; position:absolute; left:-18px; top:-28px; width:0; height:0;
  border-left:18px solid transparent; border-right:18px solid transparent;
  border-top:28px solid rgba(0,0,0,.25);
  transform:translateY(-3px) scale(1.18);
}
.ebl-raffle svg.wheel{width:100%; height:auto; display:block;
  filter:drop-shadow(0 24px 60px rgba(0,0,0,.55));
  cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;}
.ebl-raffle svg.wheel.dragging{cursor:grabbing}
.ebl-raffle svg.wheel.no-anim .rotor{transition:none}
.ebl-raffle .pointer{pointer-events:none}
.ebl-raffle .hub{pointer-events:none}
.ebl-raffle svg.wheel .rotor{
  transform-box:fill-box; transform-origin:center;
  transition:transform 6s cubic-bezier(.15,.72,.09,1);
}
.ebl-raffle .seg-label{
  font-family:"Montserrat",sans-serif; font-weight:600;
  font-size:20px; letter-spacing:.3px; fill:var(--sand-2);
}
.ebl-raffle .hub{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:26%; height:26%; border-radius:50%;
  background:radial-gradient(120% 120% at 30% 25%, var(--maroon-2), var(--maroon) 60%, #4d121a);
  border:3px solid rgba(235,223,204,.85);
  box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 2px 8px rgba(255,255,255,.08);
  display:flex; align-items:center; justify-content:center; z-index:4;
}
.ebl-raffle .hub img{width:64%; height:auto; opacity:.96;}

/* ===== Right panel ===== */
.ebl-raffle .panel{max-width:440px}
.ebl-raffle .brand{width:min(128px,34%); height:auto; margin:0 0 26px; opacity:.98;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:default;}

/* ===== Hidden staff control panel ===== */
.ebl-admin{position:fixed; inset:0; z-index:99999; display:none;
  align-items:center; justify-content:center; padding:20px;
  background:rgba(0,0,0,.74); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  font-family:"Montserrat",system-ui,sans-serif;}
.ebl-admin.open{display:flex}
.ebl-admin .card{width:min(460px,100%); max-height:90vh; overflow:auto;
  background:#141414; border:1px solid rgba(203,168,118,.35); border-radius:16px;
  padding:22px 22px 18px; color:#EBDFCC; box-shadow:0 30px 80px rgba(0,0,0,.6);}
.ebl-admin h3{font-family:"Space Grotesk",sans-serif; margin:0 0 4px; color:#fff; font-size:18px}
.ebl-admin .muted{color:#9c948a; font-size:12.5px; margin:0}
.ebl-admin .lbl{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:#CBA876; margin:18px 0 9px; font-weight:700}
.ebl-admin .chips{display:flex; flex-wrap:wrap; gap:8px}
.ebl-admin .chip{border:1px solid rgba(235,223,204,.25); background:#1e1e1f; color:#EBDFCC;
  padding:8px 13px; border-radius:999px; font-size:13px; cursor:pointer; transition:.15s}
.ebl-admin .chip.active{background:#6E1B26; border-color:#8a2531; color:#fff}
.ebl-admin .chip.off{opacity:.4; text-decoration:line-through}
.ebl-admin .armed{margin-top:16px; font-size:13px; color:#CBA876; min-height:18px}
.ebl-admin .row{display:flex; gap:10px; margin-top:16px}
.ebl-admin .btn{flex:1; border:0; border-radius:10px; padding:12px; font-weight:700;
  cursor:pointer; font-family:"Space Grotesk",sans-serif; font-size:14px}
.ebl-admin .btn.primary{background:linear-gradient(180deg,#fff,#f2ead9); color:#161616}
.ebl-admin .btn.ghost{background:transparent; border:1px solid rgba(235,223,204,.3); color:#EBDFCC}
.ebl-admin .dots{font-size:26px; letter-spacing:8px; text-align:center; min-height:30px; color:#CBA876; margin:6px 0 2px}
.ebl-admin .pin{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.ebl-admin .pin button{padding:15px; font-size:18px; border-radius:10px;
  border:1px solid rgba(235,223,204,.2); background:#1e1e1f; color:#EBDFCC; cursor:pointer;
  font-family:"Space Grotesk",sans-serif}
.ebl-admin .pin button:active{background:#6E1B26}
.ebl-admin .err{color:#e08; font-size:12.5px; text-align:center; min-height:16px; margin-top:6px}
.ebl-raffle h1{
  font-family:"Space Grotesk",sans-serif; font-weight:700;
  font-size:clamp(26px,4.4vw,40px); line-height:1.08; margin:0 0 28px;
  color:#fff; letter-spacing:-.5px;
}
.ebl-raffle h1 .accent{color:var(--gold-2)}
.ebl-raffle .spin-btn{
  appearance:none; border:0; cursor:pointer; width:100%;
  background:linear-gradient(180deg,#fff,#f2ead9);
  color:#161616; font-family:"Space Grotesk",sans-serif; font-weight:700;
  font-size:17px; letter-spacing:.2px; padding:17px 22px; border-radius:0;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease;
}
.ebl-raffle .spin-btn:hover{transform:translateY(-2px); box-shadow:0 16px 40px rgba(0,0,0,.45)}
.ebl-raffle .spin-btn:active{transform:translateY(0)}
.ebl-raffle .spin-btn:disabled{cursor:not-allowed; opacity:.55; transform:none}
.ebl-raffle .spin-btn:focus-visible{outline:3px solid var(--gold-2); outline-offset:3px}

/* ===== Result ===== */
.ebl-raffle .result{
  display:none;
  margin-top:22px; padding:18px 20px; border-radius:0;
  border:1px solid rgba(203,168,118,.32);
  background:linear-gradient(180deg, rgba(110,27,38,.22), rgba(13,13,14,.4));
  opacity:0; transform:translateY(8px); transition:opacity .4s ease, transform .4s ease;
  pointer-events:none;
}
.ebl-raffle .result.show{display:block; opacity:1; transform:none}
.ebl-raffle .result .tag{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:13px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold-2); margin:0 0 6px}
.ebl-raffle .result .prize{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:24px; color:#fff; margin:0 0 6px; line-height:1.15}
.ebl-raffle .result .sub{margin:0; font-size:14px; color:#c8c1b4; line-height:1.6}

@media (max-width:860px){
  .ebl-raffle .wrap{grid-template-columns:1fr; gap:34px; max-width:520px}
  .ebl-raffle .panel{max-width:none; text-align:center}
  .ebl-raffle .brand{margin-inline:auto}
  .ebl-raffle .stage{max-width:420px}
}
@media (prefers-reduced-motion:reduce){
  .ebl-raffle svg.wheel .rotor{transition:transform 1.2s ease-out}
  .ebl-raffle .spin-btn,.ebl-raffle .result{transition:none}
}
</style>
</head>
<body>
<section class="ebl-raffle">
  <div class="wrap">
    <!-- WHEEL -->
    <div class="stage">
      <div class="pointer"></div>
      <svg class="wheel" viewBox="0 0 500 500" role="img" aria-label="Prize wheel">
        <circle cx="250" cy="250" r="248" fill="none" stroke="var(--ring)" stroke-width="7"/>
        <circle cx="250" cy="250" r="243" fill="var(--ink-2)"/>
        <g class="rotor" id="rotor"></g>
      </svg>
      <div class="hub"><img id="hubLogo" alt="EBL"></div>
    </div>

    <!-- PANEL -->
    <div class="panel">
      <img class="brand" id="brandLogo" alt="EBL — Emirates Bespoke Leather">
      <h1>Win Exclusive <span class="accent">EBL</span> Gifts!</h1>
      <button class="spin-btn" id="spinBtn" type="button">🎁&nbsp; Spin &amp; Win!</button>
      <div class="result" id="result" aria-live="polite">
        <p class="tag" id="resTag">Result</p>
        <p class="prize" id="resPrize"></p>
        <p class="sub" id="resSub"></p>
      </div>
    </div>
  </div>
</section>

  function pickIndex(){
    if(forceNext !== null && SEGMENTS[forceNext]) return forceNext;
    var total = 0, i;
    for(i = 0; i < N; i++) total += Math.max(0, SEGMENTS[i].weight || 0);
    if(total <= 0) return Math.floor(Math.random() * N);

  }

    }else{
